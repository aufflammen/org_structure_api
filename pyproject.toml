[project]
name = "org-structure-api"
version = "0.1.0"
description = "REST API on FastAPI for department and employee hierarchy"
requires-python = ">=3.12"


# -----------------------
# [pytest]
# -----------------------

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]


# -----------------------
# Lint / format [ruff]
# -----------------------

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
    "ASYNC",
    "PERF",
    #    "ARG",
    #    "COM",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]


# -----------------------
# Typecheck [mypy]
# -----------------------

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_explicit = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
