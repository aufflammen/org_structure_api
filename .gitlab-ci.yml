stages:
  - validate
  - test
  - build

workflow:
  auto_cancel:
    on_new_commit: conservative

variables: # Change pip's cache directory to be inside the project directory since we can
  # only cache local items.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  VALID_FILES: app tests migration/env.py

# ---------------------------------------------------------------------------
# Reusable templates
# ---------------------------------------------------------------------------
.pip_cache:
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip

.validate-job:
  stage: validate
  image: python:3.12
  interruptible: true
  extends: .pip_cache
  before_script:
    - pip install -r requirements-dev.txt

# ---------------------------------------------------------------------------
# Stage: validate — fast checks, no database
# ---------------------------------------------------------------------------

lint:ruff:
  extends:
    - .validate-job
  script:
    - ruff check $VALID_FILES

format:ruff:
  extends:
    - .validate-job
  script:
    - ruff format --diff $VALID_FILES

typecheck:mypy:
  extends:
    - .validate-job
  script:
    - mypy $VALID_FILES
  allow_failure: true

# ---------------------------------------------------------------------------
# Stage: test — integration tests with PostgreSQL
# ---------------------------------------------------------------------------

test:pytest:
  stage: test
  image: docker:29
  interruptible: true
  extends: .pip_cache
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker compose -f compose.test.yaml --env-file .env.test up -d --wait
  script:
    - |
      docker run --rm \
        --network host \
        --env-file .env.test \
        -e PIP_CACHE_DIR=/.cache/pip \
        -v $CI_PROJECT_DIR:/app \
        -v $PIP_CACHE_DIR:/.cache/pip \
        -w /app \
        python:3.12 \
        sh -c "pip install -r requirements-dev.txt && pytest -v --junitxml=pytest-report.xml --cov"
  after_script:
    - docker compose -f compose.test.yaml --env-file .env.test down -v
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: pytest-report.xml
